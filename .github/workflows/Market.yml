name: market-brief

on:
  schedule:
    - cron: "0 0 * * 1-5"     # 00:00 UTC = 09:00 KST — 국내장 오픈
    - cron: "30 13 * * 1-5"   # 13:30 UTC ≈ 09:30 ET — 미국장 오픈(서머타임 기준, 겨울엔 1h 밀림)
  workflow_dispatch: {}        # Actions 탭 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: market
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install feedparser

      - name: Run briefing
        run: python stock.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "brief: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
